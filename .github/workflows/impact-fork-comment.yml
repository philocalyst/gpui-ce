name: Fork impact comment experiment
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: impact-fork-comment-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  authorize:
    if: github.repository == 'philocalyst/gpui-ce' && github.actor == github.repository_owner && github.event.issue.pull_request && github.event.comment.body == '/cargo-impact check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      requested: ${{ steps.plan.outputs.requested }}
      baseline: ${{ steps.plan.outputs.baseline }}
      candidate: ${{ steps.plan.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: philocalyst/gpui-ce
          persist-credentials: false
      - uses: ./tooling/cargo-impact
        with:
          source: tooling/cargo-impact
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          allowed="$(gh api "repos/philocalyst/gpui-ce/pulls/$PR_NUMBER" --jq '.state == "open" and .base.ref == "codex/impact-fork-base" and .head.repo.full_name == "philocalyst/gpui-ce"')"
          if [ "$allowed" != true ]; then
            echo 'Ignored a PR outside the fork experiment branch.'
            exit 0
          fi
          "$RUNNER_TEMP/impact/bin/cargo-impact" bot --acknowledge > plan.json
          if jq -e '. != null and .candidate_repository == "philocalyst/gpui-ce"' plan.json >/dev/null; then
            echo 'requested=true' >> "$GITHUB_OUTPUT"
            jq -r '"baseline=" + .baseline_sha, "candidate=" + .candidate_sha' plan.json >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.requested == 'true'
        with:
          name: impact-scanner
          path: ${{ runner.temp }}/impact/bin/cargo-impact
  build:
    outputs:
      artifact_url: ${{ steps.impact-artifact.outputs.artifact-url }}
    needs: authorize
    if: needs.authorize.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: philocalyst/gpui-ce
          ref: ${{ needs.authorize.outputs.baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: philocalyst/gpui-ce
          ref: ${{ needs.authorize.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impact-scanner
          path: ${{ runner.temp }}/impact/bin
      - name: Make scanner executable
        run: chmod +x "$RUNNER_TEMP/impact/bin/cargo-impact"
      - name: Prepare consumers from this fork only
        env:
          CONSUMER_REVISION: ${{ needs.authorize.outputs.baseline }}
        run: >-
          python3 baseline/tooling/cargo-impact/experiments/fork/prepare.py
          --baseline baseline --candidate candidate --output "$RUNNER_TEMP/impact-inputs"
          --consumer-revision "$CONSUMER_REVISION"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/impact-work/targets
            ${{ runner.temp }}/impact-work/workers/*/baseline/cache/cargo/registry
            ${{ runner.temp }}/impact-work/workers/*/baseline/cache/cargo/git
            ${{ runner.temp }}/impact-work/workers/*/candidate/cache/cargo/registry
            ${{ runner.temp }}/impact-work/workers/*/candidate/cache/cargo/git
            ${{ runner.temp }}/impact-work/workers/*/baseline/cache/mbx
            ${{ runner.temp }}/impact-work/workers/*/candidate/cache/mbx
            ${{ runner.temp }}/impact-work/gate-worker/*/cache/cargo/registry
            ${{ runner.temp }}/impact-work/gate-worker/*/cache/cargo/git
            ${{ runner.temp }}/impact-work/gate-target
          key: impact-fork-work-v2-${{ runner.os }}-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: impact-fork-work-v2-${{ runner.os }}-${{ github.event.issue.number }}-
      - name: Run isolated downstream checks
        env:
          BASELINE_SHA: ${{ needs.authorize.outputs.baseline }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate }}
        run: >-
          "$RUNNER_TEMP/impact/bin/cargo-impact" check
          --baseline "$RUNNER_TEMP/impact-inputs/baseline" --candidate "$RUNNER_TEMP/impact-inputs/candidate"
          --config "$RUNNER_TEMP/impact-inputs/impact.toml" --no-discovery
          --upstream-repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --baseline-sha "$BASELINE_SHA" --candidate-sha "$CANDIDATE_SHA"
          --work-dir "$RUNNER_TEMP/impact-work" --report-dir impact-report --scan-timeout-seconds 2100
      - name: Verify retained report bundle
        if: always()
        run: '"$RUNNER_TEMP/impact/bin/cargo-impact" verify --report-dir impact-report'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: impact-artifact
        if: always()
        with:
          name: downstream-impact
          path: impact-report/
          if-no-files-found: error
  report:
    needs: [authorize, build]
    if: always() && needs.authorize.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: philocalyst/gpui-ce
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impact-scanner
          path: ${{ runner.temp }}/impact/bin
      - name: Make scanner executable
        run: chmod +x "$RUNNER_TEMP/impact/bin/cargo-impact"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: downstream-impact
          path: impact-report
      - name: Verify worker evidence or preserve an explicit inconclusive result
        id: evidence
        run: |
          if "$RUNNER_TEMP/impact/bin/cargo-impact" verify --report-dir impact-report; then
            echo 'report=impact-report/report.json' >> "$GITHUB_OUTPUT"
          else
            "$RUNNER_TEMP/impact/bin/cargo-impact" report \
              --failure "Worker evidence is missing, incomplete, or failed bundle verification. Inspect the original artifact and this Actions run for preparation, cancellation, or transport failures." \
              --output-dir impact-failure
            echo 'report=impact-failure/report.json' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish only against the tested head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
          TESTED_HEAD: ${{ needs.authorize.outputs.candidate }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPORT_PATH: ${{ steps.evidence.outputs.report }}
        run: |
          report_url="${REPORT_ARTIFACT_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID}"
          "$RUNNER_TEMP/impact/bin/cargo-impact" publish \
            --repository philocalyst/gpui-ce --pull-request "$PR_NUMBER" --candidate-sha "$TESTED_HEAD" \
            --report "$REPORT_PATH" \
            --run-url "$report_url"
