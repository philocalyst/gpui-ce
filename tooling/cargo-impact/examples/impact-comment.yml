name: Impact comment bot
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: impact-comment-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  authorize:
    if: github.event.issue.pull_request && (github.event.comment.body == '@cargo-impact check' || github.event.comment.body == '/cargo-impact check')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      requested: ${{ steps.plan.outputs.requested }}
      baseline: ${{ steps.plan.outputs.baseline }}
      candidate: ${{ steps.plan.outputs.candidate }}
      candidate_repository: ${{ steps.plan.outputs.candidate_repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/cargo-impact
        with:
          source: .github/cargo-impact
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/impact/bin/cargo-impact" bot --acknowledge > plan.json
          if jq -e '. != null' plan.json >/dev/null; then
            echo 'requested=true' >> "$GITHUB_OUTPUT"
            jq -r '"baseline=" + .baseline_sha, "candidate=" + .candidate_sha, "candidate_repository=" + .candidate_repository' plan.json >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.requested == 'true'
        with:
          name: impact-scanner
          path: ${{ runner.temp }}/impact/bin/cargo-impact
  build:
    needs: authorize
    if: needs.authorize.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.authorize.outputs.candidate_repository }}
          ref: ${{ needs.authorize.outputs.candidate }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impact-scanner
          path: ${{ runner.temp }}/impact/bin
      - name: Make scanner executable
        run: chmod +x "$RUNNER_TEMP/impact/bin/cargo-impact"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/impact-work
          key: impact-untrusted-${{ runner.os }}-${{ github.event.issue.number }}-${{ github.run_id }}
          restore-keys: impact-untrusted-${{ runner.os }}-${{ github.event.issue.number }}-
      - name: Check downstream consumers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$RUNNER_TEMP/impact/bin/cargo-impact" check
          --baseline baseline --candidate candidate --config baseline/impact.toml
          --work-dir "$RUNNER_TEMP/impact-work" --report-dir impact-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: downstream-impact
          path: impact-report/
  report:
    needs: [authorize, build]
    if: always() && needs.authorize.outputs.requested == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: impact-scanner
          path: ${{ runner.temp }}/impact/bin
      - name: Make scanner executable
        run: chmod +x "$RUNNER_TEMP/impact/bin/cargo-impact"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: downstream-impact
          path: impact-report
      - name: Report if the PR still points at the tested head
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TESTED_HEAD: ${{ needs.authorize.outputs.candidate }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: >-
          "$RUNNER_TEMP/impact/bin/cargo-impact" publish
          --pull-request "$PR_NUMBER" --candidate-sha "$TESTED_HEAD"
          --report impact-report/report.json
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
