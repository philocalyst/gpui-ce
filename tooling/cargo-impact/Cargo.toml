[package]
name = "cargo-impact"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
cargo-semver-checks = "=0.51.0"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
thiserror = "2"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = { version = "2", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
