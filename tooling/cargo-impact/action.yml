name: Install cargo-impact
description: Build the trusted vendored scanner with separate binary and compilation caches.
inputs:
  source:
    description: Path to the trusted cargo-impact source and action files
    required: false
    default: .github/cargo-impact
  toolchain:
    description: Named Rust toolchain used to build the scanner
    required: false
    default: 1.99.0
runs:
  using: composite
  steps:
    - name: Identify trusted scanner inputs
      id: cache-plan
      shell: bash
      env:
        RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        RUNNER_KIND: ${{ runner.os }}-${{ runner.arch }}
        DEPENDENCY_HASH: ${{ hashFiles(format('{0}/Cargo.toml', inputs.source), format('{0}/Cargo.lock', inputs.source)) }}
        SOURCE_HASH: ${{ hashFiles(format('{0}/Cargo.toml', inputs.source), format('{0}/Cargo.lock', inputs.source), format('{0}/build.rs', inputs.source), format('{0}/src/**', inputs.source), format('{0}/examples/**', inputs.source), format('{0}/docs/**', inputs.source), format('{0}/README.md', inputs.source), format('{0}/clippy.toml', inputs.source), format('{0}/LICENSE.md', inputs.source), format('{0}/action.yml', inputs.source)) }}
      run: |
        case "$RUST_TOOLCHAIN" in
          ''|*[!a-zA-Z0-9._-]*) echo 'Use a named Rust toolchain.' >&2; exit 2 ;;
        esac
        prefix="cargo-impact-build-v2-$RUST_TOOLCHAIN-$RUNNER_KIND-$DEPENDENCY_HASH-"
        printf 'binary=cargo-impact-v2-%s-%s-%s\nbuild=%s%s\nprefix=%s\n' \
          "$RUST_TOOLCHAIN" "$RUNNER_KIND" "$SOURCE_HASH" "$prefix" "$SOURCE_HASH" "$prefix" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: scanner-cache
      with:
        path: ${{ runner.temp }}/impact/bin
        key: ${{ steps.cache-plan.outputs.binary }}
    - name: Restore trusted scanner compilation
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.scanner-cache.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/impact/scanner-target
        key: ${{ steps.cache-plan.outputs.build }}
        restore-keys: ${{ steps.cache-plan.outputs.prefix }}
    - name: Build trusted scanner
      if: steps.scanner-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SCANNER_SOURCE: ${{ inputs.source }}
        RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        CARGO_BUILD_JOBS: "2"
        CARGO_TARGET_DIR: ${{ runner.temp }}/impact/scanner-target
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
        cargo "+$RUST_TOOLCHAIN" install --locked --path "$SCANNER_SOURCE" --root "$RUNNER_TEMP/impact"
    - name: Save trusted scanner compilation
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.scanner-cache.outputs.cache-hit != 'true' && github.event_name != 'issue_comment'
      with:
        path: ${{ runner.temp }}/impact/scanner-target
        key: ${{ steps.cache-plan.outputs.build }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.scanner-cache.outputs.cache-hit != 'true' && github.event_name != 'issue_comment'
      with:
        path: ${{ runner.temp }}/impact/bin
        key: ${{ steps.cache-plan.outputs.binary }}
